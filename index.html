const angTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const dist=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);};
const hexR=(h)=>parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);

addEventListener('keydown',e=>{
  const n=keyMap[e.key.toLowerCase()];
  if(!n)return;
  if(n==='dash'||n==='L'||n==='R'||n==='U'||n==='D')keys[n]=true;
  if(n==='dash'&&state==='play'&&player)toDash();
  if(n==='pause'){if(state==='play')state='pause';else if(state==='pause')state='play';}

  if(n==='start'&&state==='title')startRun();
  if(state==='card'&&e.key>='1'&&e.key<='3'){
    const idx=Number(e.key)-1;
    if(idx<cardOffer.length){
      cardOffer[idx].run();

      state='play';

const PTR={list:{},joy:null};
let ROTATED=false;
function applyOrientation(){
  const hasTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  ZOOM=hasTouch?1.35:1;
  const vv=window.visualViewport;
  const vw=vv&&vv.width?vv.width:window.innerWidth;
  const vh=vv&&vv.height?vv.height:window.innerHeight;
  const portrait=hasTouch&&vh>vw;
  const wrap=document.getElementById('wrap');
  if(portrait){
    const wwrap=Math.min(vh,177.78*vw/100),hwrap=Math.min(vw,56.25*vh/100);
    ROTATED=true;
    wrap.style.cssText='position:absolute;left:50%;top:50%;margin:0;width:'+wwrap+'px;height:'+hwrap+'px;transform:translate(-50%,-50%) rotate(-90deg);';
  }else{
    ROTATED=false;
    wrap.style.cssText='';
  }
}
addEventListener('resize',applyOrientation);
addEventListener('orientationchange',()=>setTimeout(applyOrientation,150));
if(window.visualViewport)window.visualViewport.addEventListener('resize',applyOrientation);
applyOrientation();
function ptrPos(e){
  const r=canvas.getBoundingClientRect();
  if(ROTATED)return {x:(r.bottom-e.clientY)*W/r.height,y:(e.clientX-r.left)*H/r.width};
  return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
function joyFromPts(){
  const id=PTR.joy;
  if(id===null)return {active:false,x:0,y:0,dx:0,dy:0};
  const p=PTR.list[id];
  const dx=p.x-p.ax,dy=p.y-p.ay;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const m=Math.min(len,95);
  return {active:true,x:p.ax,y:p.ay,dx:dx/len*m,dy:dy/len*m};
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!document.fullscreenElement&&navigator.maxTouchPoints>0&&document.documentElement.requestFullscreen){
    try{document.documentElement.requestFullscreen().catch(()=>{});}catch(_){}
  }
  const p=ptrPos(e);
  canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
  PTR.list[e.pointerId]={x:p.x,y:p.y,ax:p.x,ay:p.y,joy:false};
  if(state==='play'){
    if(PTR.joy===null&&p.y>H*0.5&&p.x<W*0.55){
      PTR.joy=e.pointerId;PTR.list[e.pointerId].joy=true;PTR.list[e.pointerId].ax=p.x;PTR.list[e.pointerId].ay=p.y;
    }else if(p.y>H*0.52&&p.x>W*0.55){
      toDash();
    }
  }
  if(state==='title'||state==='board')return;
  if(state==='card'&&cardOffer.length){tapCard(p);return;}
  if(state==='gameover'){gameOverTap(p);return;}
  if(state==='play'||state==='pause'){
    if(p.x>=W-72&&p.x<=W-20){
      if(p.y>=18&&p.y<=66){state=state==='pause'?'play':'pause';return;}
      if(p.y>=84&&p.y<=132){SOUND.muted=!SOUND.muted;return;}
    }
  }
});
addEventListener('pointermove',e=>{const p=ptrPos(e);if(PTR.list[e.pointerId]){PTR.list[e.pointerId].x=p.x;PTR.list[e.pointerId].y=p.y;}});
addEventListener('pointerup',e=>{
  const id=e.pointerId;
  const t=PTR.list[id];
  if(t!==undefined&&state==='title'&&Math.hypot(t.x-t.ax,t.y-t.ay)<12){
    if(t.y>H-80){openBoard('title');}

    state=boardFrom;
  }
  if(PTR.joy===id)PTR.joy=null;
  delete PTR.list[id];
});
addEventListener('pointercancel',e=>{const id=e.pointerId;if(PTR.joy===id)PTR.joy=null;delete PTR.list[id];});

const SOUND={
  ctx:null,muted:false,
  init(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC();}},
  tone(f,type,d,vol){
    if(this.muted||!this.ctx)return;
    let ct=this.ctx.currentTime;
    if(!isFinite(ct))ct=0;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.08,ct);
    g.gain.exponentialRampToValueAtTime(0.001,ct+d);
    o.connect(g);g.connect(this.ctx.destination);
    o.start(ct);o.stop(ct+d);
  },
  noise(d,vol){
    if(this.muted||!this.ctx)return;
    let ct=this.ctx.currentTime;
    if(!isFinite(ct))ct=0;
    const n=this.ctx.sampleRate* d;
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const ch=buf.getChannelData(0);
    for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource();s.buffer=buf;
    const g=this.ctx.createGain();g.gain.value=vol||0.15;
    s.connect(g);g.connect(this.ctx.destination);s.start(ct);
  },
  hit(){if(Math.random()<0.4)this.noise(0.08,0.12);},
  shot(){this.tone(520+Math.random()*120,'square',0.06,0.045);},
  gem(){if(Math.random()<0.3)this.tone(760+Math.random()*200,'sine',0.05,0.03);},
  hurt(){this.tone(180,'sawtooth',0.16,0.14);this.noise(0.12,0.2);},
  lvl(){[440,550,660,880].forEach((f,i)=>setTimeout(()=>this.tone(f,'square',0.12,0.09),i*70));},
  die(){this.tone(90,'sawtooth',0.5,0.2);this.noise(0.4,0.3);},
  pick(){this.tone(600,'triangle',0.1,0.06);}
};

let boardFrom='title';

let _boardLastFetch=0;
async function loadBoard(){
  const now=Date.now();
  if(_boardCache.length>0&&now-_boardLastFetch<3000)return _boardCache;
  try{
    const res=await fetch(LB_URL);
    if(!res.ok)return _boardCache;
    const data=await res.json();
    if(!data)return _boardCache;
    const arr=Object.values(data);
    _boardCache=arr.filter(r=>r&&typeof r.s==='number'&&r.s>0).sort((a,b)=>b.s-a.s).slice(0,200);
    _boardLastFetch=now;
    return _boardCache;
  }catch(_){return _boardCache;}
}

function myBoardRank(s){
  const b=_boardCache;
  for(let i=0;i<b.length;i++)if(b[i].s===s&&b[i].uid===playerUID)return i+1;
  return 0;
}
async function gameOverSaveScore(){
  try{
    const now=Math.floor(T);
    if(now<=0)return;
    const myName=getPlayerName();
    const res=await fetch(LB_URL);
    const data=await res.json();
    const current=data||{};
    const entryKey=playerUID+'_'+now+'_'+Math.random().toString(36).slice(2,6);
    current[entryKey]={n:myName,s:now,lv:player.level,k:kills,uid:playerUID,ts:Date.now()};
    const arr=Object.values(current).sort((a,b)=>b.s-a.s);
    const trimmed={};
    arr.slice(0,200).forEach((r,i)=>{trimmed['e'+i]=r;});
    await fetch(LB_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(trimmed)});
    _boardLastFetch=0;
    _boardCache=arr.slice(0,200);
    const rank=_boardCache.findIndex(r=>r.uid===playerUID&&r.s===now)+1;
    if(rank>0&&rank<=10){
      let nm=null;
      try{nm=prompt('🏆 你进入前十名（第'+rank+'名）！输入你的名字：',myName);}catch(_){}
      if(nm&&String(nm).trim()){
        const clean=String(nm).trim().slice(0,16);
        try{localStorage.setItem('vs_name',clean);}catch(_){}
        const res2=await fetch(LB_URL);
        const data2=await res2.json();
        if(data2){let chg=false;for(const[key,val]of Object.entries(data2)){if(val.uid===playerUID){data2[key].n=clean;chg=true;}}if(chg){await fetch(LB_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data2)});}}
        _boardLastFetch=0;
      }
    }
  }catch(_){}
}

function pickNearest(rng){
  let best=null,bd=rng*rng,bx=player.x,by=player.y;
  for(const e of enemies){
    const dx=e.x-bx,dy=e.y-by;const d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=e;}
  }
  return best;
}

function nearestEnemy(x,y,rng){
  let best=null,bd=rng*rng;
  for(const e of enemies){
    if(e.dead)continue;
    const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=e;}
  }
  return best;
}

function applyDmg(e,d,knock,kx,ky){
  if(e.defense>0)d*=(1-e.defense);
  if(e.boss&&e.inv>0){
    return;
  }
  // Dragon weak spot: head takes 1.5x damage
  if(e.bossType==='dragon_ignix'&&e.dragonWeakSpot){
    const hdx=player.x-(e.headX||e.x),hdy=player.y-(e.headY||e.y-50);
    if(Math.hypot(hdx,hdy)<60)d*=1.5;
  }
  // Mech abom part destruction
  if(e.bossType==='mech_abom'&&!e.armsBroken){
    let armDmg=d;
    if(e.leftArmHp>0&&e.rightArmHp>0){
      e.leftArmHp-=armDmg*0.5;e.rightArmHp-=armDmg*0.5;
    }else if(e.leftArmHp>0){
      e.leftArmHp-=armDmg;
    }else if(e.rightArmHp>0){
      e.rightArmHp-=armDmg;
    }
    if(e.leftArmHp<=0&&e.rightArmHp<=0){e.leftArmHp=0;e.rightArmHp=0;e.armsBroken=true;}
    e.hitFlash=0.14;e.kx=(e.kx||0)+kx*knock;e.ky=(e.ky||0)+ky*knock;
    texts.push({x:e.x,y:e.y-16,txt:Math.round(d),col:'#ffe9b0',t:0,dur:0.55,vy:-52});
    if(texts.length>40)texts.shift();
    return;
  }
  e.hp-=d;
  const cl=charmLeech();
  if(cl>0&&player&&player.hp>0&&player.hp<player.maxHp)player.hp=Math.min(player.maxHp,player.hp+d*cl);
  e.hitFlash=0.14;
  e.kx=(e.kx||0)+kx*knock;
  e.ky=(e.ky||0)+ky*knock;
  texts.push({x:e.x,y:e.y-16,txt:Math.round(d),col:'#ffe9b0',t:0,dur:0.55,vy:-52});
  if(texts.length>40)texts.shift();
  if(e.hp<=0&&!e.dead){e.dead=true;kill(e);}
}

  if(parts.length>200)parts.splice(0,parts.length-200);
  const v=e.gem||e.xp;
  gems.push({x:e.x,y:e.y,val:v,vx:rnd(-40,40),vy:rnd(-40,40),r:5});
  if(gems.length>150)gems.shift();
  SOUND.hit();

  if(hasWolfCharm()&&Math.random()<wolfCharmChance()){
    ghostWolves.push({x:e.x,y:e.y,t:15,vx:rnd(-30,30),vy:rnd(-30,30),dmg:player.dmgMult*0.5,hit:new Set(),hitT:0});

  }
  // Dragon scale flame
  if(hasDragonScale()&&Math.random()<dragonScaleChance()){
    fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:0.5,r0:8,r1:80,col:'#ff6040'});

      if(en.dead||en===e)continue;
      if(dist(en,e)<80)applyDmg(en,player.dmgMult*80,8,Math.cos(angTo(e,en)),Math.sin(angTo(e,en)));

    shake=Math.max(shake,3);
  }
  if(e.chest){chest={x:e.x,y:e.y,t:0};fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:0.6,r0:4,r1:70,col:'#ffd24a'});shake=Math.max(shake,8);flash=0.2;}
  if(e.elite){shake=Math.max(shake,10);SOUND.die();}
}

    if(own<defW.max){
      if(id==='bird'&&Math.random()>0.4)continue;
      const nl=own+1;
      pool.push({
        name:defW.name,
        icon:defW.icon,
        kind:own===0?'新武器':'强化',
        rarity:id==='bird'?4:rarityOf(nl),
        lv:nl,
        desc:own===0?(id==='bird'?'传说武器：'+defW.name:'解锁新武器：'+defW.name):('升级至 Lv.'+nl+' · '+RARITY[rarityOf(nl)]),
        stats:getWeaponDesc(id,defW.cfg(nl)),
        run(){giveWeapon(id);}
      });
    }
  }
  for(const s of STATS)pool.push({name:s.name,icon:'●',kind:'属性',desc:s.desc,run:s.run});
  for(const id of Object.keys(EQUIPS)){
    if(BOSS_EQUIP_IDS.includes(id))continue;
    const def=EQUIPS[id];
    const own=player.equips[id]||0;
    if(own<def.max){
      const nl=own+1;
      pool.push({name:def.name,icon:def.icon,kind:'装备',rarity:own===0?0:Math.min(3,own),desc:(own===0?'获得':'升级至 Lv.'+nl)+' '+def.name+'：'+getEquipDesc(id,nl),run(){giveEquip(id);}});
    }
  }
  const picks=new Set();
  const newCards=pool.filter(c=>c.kind==='新武器');
  if(newCards.length)picks.add(newCards[rndi(0,newCards.length-1)]);
  while(picks.size<Math.min(3,pool.length)&&picks.size<20){
    picks.add(pool[rndi(0,pool.length-1)]);
  }
  cardOffer=[...picks];
  cardShownAt=performance.now();
  state='card';
}

function tapCard(p){
  if(cardShownAt&&performance.now()-cardShownAt<250)return;
  const n=cardOffer.length;
  const bw=310,wor=Math.min(64,(W-bw*n)/(n+1));
  for(let i=0;i<n;i++){
    const cx=wor+(bw+wor)*i;
    if(p.x>=cx&&p.x<=cx+bw&&p.y>=H/2-150&&p.y<=H/2+106){
      cardOffer[i].run();
      cardOffer=[];
      state='play';
      SOUND.pick();
      return;
    }
  }
}

function gameOverTap(p){
  const bw=280,bh=70,bx=(W-bw)/2,by=H/2+60;
  const cw=260,ch=64,cx=(W-cw)/2,cy=H/2+150;
  const sw=240,sh=44,sx=(W-sw)/2,sy=H/2+240;
  const lbw=240,lbh=44,lbx=(W-lbw)/2,lby=H/2+296;
  if(p.x>=bx&&p.x<=bx+bw&&p.y>=by&&p.y<=by+bh){startRun();}
  else if(p.x>=cx&&p.x<=cx+cw&&p.y>=cy&&p.y<=cy+ch)location.reload();
  else if(p.x>=sx&&p.x<=sx+sw&&p.y>=sy&&p.y<=sy+sh)shareScore();
  else if(p.x>=lbx&&p.x<=lbx+lbw&&p.y>=lby&&p.y<=lby+lbh){openBoard('gameover');}
}

function copyText(txt){
  return new Promise(res=>{
    const ta=document.createElement('textarea');
    ta.value=txt;
    ta.style.position='fixed';
    ta.style.left='-9999px';
    document.body.appendChild(ta);
    ta.focus();ta.select();
    let ok=false;
    try{ok=document.execCommand('copy');}catch(_){}
    document.body.removeChild(ta);
    res(ok);
  });
}

async function shareScore(){
  const txt='血夜幸存者 成绩：存活 '+Math.floor(T/60)+'分'+Math.floor(T%60)+'秒 · 第'+wave+'波 · 击杀 '+kills+' 人 · 等级 Lv.'+player.level+' · 总经验 '+xpGot;
  let done=false;
  try{
    if(navigator.share){
      await navigator.share({title:'血夜幸存者',text:txt});
      done=true;
    }
  }catch(e){if(e&&e.name==='AbortError')done=true;}
  if(!done){
    let ok=false;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(txt);
        ok=true;
      }
    }catch(_){}
    if(!ok)ok=await copyText(txt);
    if(ok){
      texts.push({x:player.x,y:player.y-30,txt:'成绩已复制到剪贴板',col:'#bfe8cf',t:0,dur:1.2,vy:-30});
      SOUND.pick();
    }else{
      texts.push({x:player.x,y:player.y-30,txt:txt,col:'#bfe8cf',t:0,dur:2.5,vy:-20});
    }
  }
}

function update(dt){
  if(state!=='play'&&state!=='card')return;
  if(state==='play'){
    T+=dt;
    const p=player;
    const mv=joyFromPts();
    let mx=0,my=0;
    if(keys.L)mx-=1;if(keys.R)mx+=1;if(keys.U)my-=1;if(keys.D)my+=1;
    if(!(mx||my)&&mv.active){
      const jl=Math.sqrt(mv.dx*mv.dx+mv.dy*mv.dy);
      if(jl>10){const ramp=(jl-10)/85;mx=(mv.dx/95)*ramp;my=(mv.dy/95)*ramp;}
    }
    if(mx||my){
      const m=Math.sqrt(mx*mx+my*my);
      mx/=m;my/=m;
      p.facing=Math.atan2(my,mx);
      currentMove=1;
    }else{currentMove=0;}
    if(p.dashT>0){
      p.dashT-=dt;
      p.x+=Math.cos(p.dashA)*420*dt;p.y+=Math.sin(p.dashA)*420*dt;
      currentMove=1;
    }else{
      p.x+=mx*200*p.spdMult*dt;p.y+=my*200*p.spdMult*dt;
    }
    p.x=clamp(p.x,26,WORLD-26);p.y=clamp(p.y,26,WORLD-26);
    p.dashCd=Math.max(0,p.dashCd-dt);
    p.inv=Math.max(0,p.inv-dt);
    const grow=Math.floor(T/60);
    if(grow!==p.growT){p.growT=grow;p.dmgMult*=1.015;}
    if(p.regen>0&&p.hp>0&&p.hp<p.maxHp)p.hp=Math.min(p.maxHp,p.hp+p.regen*dt);

    let alive=[];
    for(const e of enemies){
      if(e.dead)continue;
      e.hitFlash=Math.max(0,(e.hitFlash||0)-dt);
      e.slow=Math.max(0,(e.slow||0)-dt);
      if(e.dmgMulT>0){e.dmgMulT-=dt;if(e.dmgMulT<=0)e.dmgMul=1;}
      e.kx=(e.kx||0)*0.82;
      e.ky=(e.ky||0)*0.82;
      if(e.freeze>0){e.freeze-=dt;alive.push(e);continue;}
      if(e.lungeT>0){
        e.lungeT-=dt;
        e.x+=e.lungeVX*dt;e.y+=e.lungeVY*dt;
        e.x=clamp(e.x,20,WORLD-20);e.y=clamp(e.y,20,WORLD-20);
        if(dist(e,player)<e.r+p.r+4)hurtPlayer(e.dmg*(e.dmgMul||1)*0.7,angTo(player,e));
        alive.push(e);continue;
      }
      if(e.elite){
        if(e.ramT>0){
          e.ramT-=dt;
          e.x+=e.ramVX*dt;e.y+=e.ramVY*dt;
          e.x=clamp(e.x,20,WORLD-20);e.y=clamp(e.y,20,WORLD-20);
          if(dist(e,player)<e.r+p.r+4)hurtPlayer(e.dmg*(e.dmgMul||1),angTo(player,e));
          alive.push(e);continue;
        }
        if(e.teleT>0){
          e.teleT-=dt;
          if(!e.teleFx){
            e.teleFx=true;
            fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:0.8,r0:10,r1:120,col:e.spec==='ram'?'#ff5060':(e.spec==='beam'?'#ffd24a':'#ff9ad4')});
            fx.push({kind:'spark',x:e.x,y:e.y,t:0,dur:0.8,col:'#ff5070'});
            SOUND.hit();
          }
          alive.push(e);continue;
        }
        e.specT=(e.specT||0)-dt;
        if(e.spec==='shot'){
          e.spec=null;e.specT=rnd(3.5,6);
          const sa=angTo(e,player);
          ebolts.push({x:e.x,y:e.y,dx:Math.cos(sa)*520,dy:Math.sin(sa)*520,life:3.4,r:11,dmg:e.dmg*1.3,kind:'eliteShot'});
          SOUND.shot();
        }else if(e.spec==='ram'){
          e.spec=null;e.specT=rnd(4,7);
          const ra=angTo(e,player);
          e.ramT=0.9;e.ramVX=Math.cos(ra)*650;e.ramVY=Math.sin(ra)*650;
          shake=Math.max(shake,6);
        }else if(e.spec==='beam'){
          e.spec=null;e.specT=rnd(5,8);
          const ba=angTo(e,player);
          ebolts.push({x:e.x,y:e.y,dx:Math.cos(ba)*580,dy:Math.sin(ba)*580,life:3.2,r:15,dmg:e.dmg*1.8,kind:'eliteShot'});
          SOUND.shot();shake=Math.max(shake,8);
        }else if(e.specT<=0){
          const sp=Math.random();
          e.spec=sp<0.35?'shot':(sp<0.7?'ram':'beam');
          e.teleT=0.8;e.teleFx=false;
          alive.push(e);continue;
        }
      }
      if(e.boss){
        e.slow=0;e.kx=0;e.ky=0;if(e.freeze>0)e.freeze=0;
        const a=angTo(e,player);
        const d=dist(player,e);
        e.cd=(e.cd||0)-dt;
        e.stT=(e.stT||0)-dt;
        if(d<e.r+p.r+12&&(e.invContact||0)<=0){
          e.invContact=0.5;
          hurtPlayer(e.dmg*1.5,a);
          shake=Math.max(shake,6);
        }
        e.invContact=(e.invContact||0)-dt;
        const bt=e.bossType||'knight_shadow';
        e.phase=(e.phase||0)-dt;
        if(bt==='knight_shadow'){
          e.shadowClones=(e.shadowClones||0);
          if(e.phase<=0){
            e.phase=rnd(0.8,1.6);
            e.cd=0;
            const r=Math.random();
            if(d>350&&r<0.3)e.pattern='shadow_dash';
            else if(r<0.45&&e.shadowClones<3)e.pattern='shadow_clone';
            else if(r<0.65)e.pattern='dark_slash';
            else if(r<0.85)e.pattern='shadow_beam';
            else e.pattern='shadow_rain';
          }
          if(e.st===1){
            e.vx*=0.85;e.vy*=0.85;
            if(e.stT<=0){
              e.st=2;e.stT=0.5;
              if(e.pattern==='shadow_dash'){
                e.stT=0.7;
                e.blinkX=player.x+Math.cos(a)*(d>120?d-120:0);
                e.blinkY=player.y+Math.sin(a)*(d>120?d-120:0);
                e.blinkX=clamp(e.blinkX,60,WORLD-60);
                e.blinkY=clamp(e.blinkY,60,WORLD-60);
                fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:0.35,r0:10,r1:80,col:'#7030c0'});
                e.x=e.blinkX;e.y=e.blinkY;
                fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:0.4,r0:30,r1:90,col:'#9040e0'});
                shake=Math.max(shake,12);
                const da2=dist(player,e);
                if(da2<120)hurtPlayer(e.dmg*2.2,angTo(e,player));
                SOUND.die();
              }else if(e.pattern==='shadow_clone'){
                e.stT=0.4;
                e.shadowClones++;
                for(let i=0;i<3;i++){
                  const ca=Math.random()*Math.PI*2;
                  const cd2=150+rnd(50,200);
                  const cx=e.x+Math.cos(ca)*cd2,cy=e.y+Math.sin(ca)*cd2;
                  fx.push({kind:'ring',x:cx,y:cy,t:0,dur:0.5,r0:4,r1:30,col:'#6020a0'});
                  enemies.push({x:clamp(cx,20,WORLD-20),y:clamp(cy,20,WORLD-20),hp:1,maxHp:1,r:20,col:'#6020a0',spd:0,spdV:0,dmg:e.dmg*0.8,xp:0,cd:0.3,kind:'clone',clone:true,cloneT:3.5,cloneTarget:null,cloneVX:0,cloneVY:0,slow:0,st:0,stT:0,dead:false,elite:false,chest:false,boss:false,scl:1.3});
                }
                SOUND.shot();shake=Math.max(shake,6);
              }else if(e.pattern==='dark_slash'){
                e.stT=0.35;
                fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:0.4,r0:15,r1:200,col:'#8050c0'});
                shake=Math.max(shake,10);
                if(d<200)hurtPlayer(e.dmg*1.8,a);
                SOUND.hit();
              }else if(e.pattern==='shadow_beam'){
                e.stT=1.0;
                e.beamAng=angTo(e,player);
                fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:1.0,r0:10,r1:800,col:'#7030c0'});
                shake=Math.max(shake,14);
                SOUND.die();
              }else if(e.pattern==='shadow_rain'){
                e.stT=0.4;
                e.shadowRainT=2.5;
                SOUND.shot();
              }
            }
          }else if(e.st===2){
            e.vx*=0.9;e.vy*=0.9;
            if(e.pattern==='shadow_beam'){
              if(e.beamAng!==undefined&&d<800){
                const da2=angTo(e,player);
                let diff=da2-e.beamAng;
                while(diff>Math.PI)diff-=Math.PI*2;
                while(diff<-Math.PI)diff+=Math.PI*2;
                if(Math.abs(diff)<0.3)hurtPlayer(e.dmg*2.5,a);
              }
            }else if(e.pattern==='shadow_rain'){
              e.shadowRainT=(e.shadowRainT||0)-dt;
              if(e.shadowRainT>0&&Math.random()<dt*14){
                const rx=player.x+rnd(-450,450),ry=player.y+rnd(-450,450);
                fx.push({kind:'spark',x:rx,y:ry,t:0,dur:0.3,col:'#7030c0'});
                if(Math.hypot(rx-player.x,ry-player.y)<40)hurtPlayer(e.dmg*0.9,a);
              }
              if(e.shadowRainT<=0)e.stT=0;
            }
            if(e.stT<=0){e.st=0;e.cd=rnd(0.2,0.5);}
          }else{
            if(e.cd<=0&&d<400){
              e.st=1;e.stT=0.3;
            }
            const spd=e.spd*(0.8+0.3*Math.sin(T*3.5+e.r));
            const lr=Math.min(1,dt*9);
            e.vx+=(Math.cos(a)*spd-e.vx)*lr;
            e.vy+=(Math.sin(a)*spd-e.vy)*lr;
            const vr=Math.sqrt(e.vx*e.vx+e.vy*e.vy);
            const cap=e.spd+e.spdV;
            if(vr>cap){e.vx=e.vx/vr*cap;e.vy=e.vy/vr*cap;}
            if(d<e.r+p.r+2){
              e.x-=Math.cos(a)*dt*30;e.y-=Math.sin(a)*dt*30;
            }
          }
}else if(bt==='blood_wolf'){
          e.wolfCd=(e.wolfCd||0)-dt;
          if(e.wolfCd<=0){
            e.wolfCd=8;
            const numWolves=3+Math.floor(Math.random()*3);
            for(let i=0;i<numWolves;i++){
              const ang2=Math.random()*Math.PI*2;
              const dd2=500+Math.random()*300;

          if(e.hp<e.maxHp*0.5&&!e.howlUsed){

            for(const w of aliveWolves)w.cd=Math.min(w.cd||0.5,0.25);
            fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:0.8,r0:10,r1:400,col:'#ff2040'});
            shake=Math.max(shake,14);
            SOUND.die();
          }
          e.howlT=(e.howlT||0)-dt;

          if(e.defenseT<=0)e.defense=0;
          if(e.phase<=0){
            e.phase=rnd(0.8,1.5);

            if(d>300&&Math.random()<0.5)e.pattern='moon_pounce';

          }

                e.stT=0.8;
                const v=750+Math.random()*300;
                e.vx=Math.cos(a)*v;e.vy=Math.sin(a)*v;

                shake=Math.max(shake,10);
                SOUND.hit();
              }else{
                e.stT=0.35;
                fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:0.3,r0:10,r1:120,col:'#ff3040'});
                if(d<120)hurtPlayer(e.dmg*1.5,a);
                shake=Math.max(shake,8);
                SOUND.hit();
              }
            }
          }else if(e.st===2){
            e.vx*=0.92;e.vy*=0.92;
            if(e.pattern==='moon_pounce'){
              if(d<150){
                fx.push({kind:'ring',x:e.x,y:e.y,t:0,dur:0.5,r0:10,r1:150,col:'#ff5060'});
                hurtPlayer(e.dmg*2.0,a);
                shake=Math.max(shake,12);
                e.st=0;e.cd=rnd(0.3,0.6);
              }
            }
            if(e.stT<=0){e.st=0;e.cd=rnd(0.2,0.5);}
          }else{
            if(e.cd<=0&&d<350){
              e.st=1;e.stT=0.28;
            }
            const spd=e.spd*(0.85+0.25*Math.sin(T*4+e.r));
            const lr=Math.min(1,dt*10);
            e.vx+=(Math.cos(a)*spd-e.vx)*lr;
            e.vy+=(Math.sin(a)*spd-e.vy)*lr;
            const vr=Math.sqrt(e.vx*e.vx+e.vy*e.vy);
            const cap=e.spd+e.spdV;
            if(vr>cap){e.vx=e.vx/vr*cap;e.vy=e.vy/vr*cap;}
            if(d<e.r+p.r+2){
              e.x-=Math.cos(a)*dt*30;e.y-=Math.sin(a)*dt*30;
            }
          }
        }else if(bt==='mech_abom'){
          if(e.armsBroken&&e.hp<e.maxHp*0.3){
            e.repairCd=(e.repairCd||0)-dt;

              e.repairing=true;e.repairT=4;

              texts.push({x:e.x,y:e.y-50,txt:'正在修复...',col:'#ff6020',t:0,dur:4,vy:-20});
            }
          }
          if(e.repairing){
            e.repairT=(e.repairT||0)-dt;
            if(e.repairT<=0||(e.hitFlash>0&&Math.random()<0.3)){
              if(e.repairT<=0){
                e.leftArmHp=e.leftArmMax*0.5;e.rightArmHp=e.rightArmMax*0.5;

              if(r<0.6)e.pattern='poison_spray';

        const hp=(kind==='golem'?def.hp:def.hp*0.7)*hpS*hpMul*1.5;
        allocEnemy(kind,rp.wx,rp.wy,{hp:Math.round(hp),maxHp:Math.round(hp),spd:def.spd*(0.85+Math.min(T*0.0025,0.35)),dmg:def.dmg*(1.3+player.level*0.07),r:def.r,col:def.col,spdV:def.spdV,xp:Math.max(1,Math.round(def.xp*Math.min(1,0.6+player.level*0.01))),cd:rnd(0.15,0.45),scl:def.scl});
      }
    }

    if(T>=nextElite&&!bossActive&&!bossWarn){
      nextElite+=Math.max(12,36-T*0.05)+rnd(0,10);
      if(!eliteWarn&&!enemies.some(e=>e.elite)&&T>12&&(T>240?1:Math.random()<0.92)){
        const rp=spawnRingPos();
        eliteWarn={x:rp.wx,y:rp.wy,t:1.0};
        fx.push({kind:'ring',x:rp.wx,y:rp.wy,t:0,dur:1.0,r0:6,r1:40,col:'#ff5060'});
      }
    }

    for(const w of player.weapons){
      w.t-=dt;
      const def=WEPS[w.id];
      const mult=w.mult||1;
      if(w.id==='aura'){
        if(w.t<=0){w.t=def.cfg(w.lv).cd*watchMult();def.tick(w.lv,player,mult);}
      }else if(w.id==='bird'){
        const c=def.cfg(w.lv);
        while(birds.length<c.n){
          birds.push({x:player.x+rnd(-50,50),y:player.y+rnd(-20,30),t:rnd(0,1),ang:Math.random()*6.28,i:birds.length,st:'follow',tgt:null,wing:Math.random()*6,size:1,kills:0,hit:new Set(),hitT:0});
        }
        if(birds.length>c.n)birds.length=c.n;
      }else{
        if(w.t<=0){
          const cfg=def.cfg(w.lv);
          w.t=cfg.cd*player.cdMult*watchMult();
          let fcBonus=1;
          if(hasFurnaceCore()&&furnaceCoreTimer>=5){
            fcBonus=1+furnaceCoreBonus();
            furnaceCoreTimer=0;
            fx.push({kind:'spark',x:player.x,y:player.y-20,t:0,dur:0.3,col:'#ff8040'});
          }
          def.fire(w.lv,player,mult*fcBonus);
        }
      }
    }
    const bookW=player.weapons.find(w=>w.id==='tome');
    if(bookW){
      let t2=[];
      for(const to of tomes){
        to.t+=dt;
        const k=clamp(to.t/0.55,0,1);
        to.x=to.sx+Math.cos(to.ang)*to.dst*k;
        to.y=to.sy+Math.sin(to.ang)*to.dst*k;
        if(k>=1){
          let hit=false;
          for(const e of enemies){
            const dx=e.x-to.x,dy=e.y-to.y,rr=to.rad+e.r;
            if((dx<rr||-dx<rr)&&(dy<rr||-dy<rr)&&dx*dx+dy*dy<rr*rr){
              hit=true;
              applyDmg(e,to.dmg,12,Math.cos(angTo(e,to)),Math.sin(angTo(e,to)));
            }
          }
          fx.push({kind:'ring',x:to.x,y:to.y,t:0,dur:0.45,r0:6,r1:to.rad,col:'#ffd24a'});
          fx.push({kind:'spark',x:to.x,y:to.y,t:0,dur:0.25,col:'#ffe9b0'});
          zones.push({x:to.x,y:to.y,r:to.rad*0.8,dmg:to.dmg*0.4,t:2.6,tickT:0,col:'#c86aff'});
          shake=Math.max(shake,hit?4:2);
          SOUND.hit();
        }else t2.push(to);
      }
      tomes=t2;
    }
    const birdW=player.weapons.find(w=>w.id==='bird');
    if(birdW){
      const c=WEPS.bird.cfg(birdW.lv);
      const bmult=birdW.mult||1;
      for(const b of birds){
        b.wing+=dt*16;
        b.ang+=dt*2.2;
        b.size=Math.min(BIRD_SIZE_MAX,1+b.kills*0.15);
        const bs=b.size;
        const dmgK=1+0.5*(bs-1);
        const br=9*bs;
        b.hitT-=dt;
        if(b.hitT<=0){b.hit.clear();b.hitT=0.8;}
        const tx=player.x+Math.cos(b.ang)*c.rad,ty=player.y-18+Math.sin(b.ang)*c.rad*0.4;
        if(b.st==='follow'){
          b.t-=dt;
          b.x+=(tx-b.x)*Math.min(1,dt*5);
          b.y+=(ty-b.y)*Math.min(1,dt*5);
          if(b.t<=0){
            const tgt=nearestEnemy(b.x,b.y,c.rng+20*bs);
            if(tgt){b.st='strike';b.tgt=tgt;}
          }
        }else{
          const t=b.tgt;
          if(!t||t.dead||dist(b,t)>c.rng*2){
            b.st='follow';b.t=Math.max(0.3,c.cd*watchMult()*0.5);b.tgt=null;continue;
          }
          const a=angTo(b,t);
          b.x+=Math.cos(a)*c.spdStrike*dt;
          b.y+=Math.sin(a)*c.spdStrike*dt;
          if(dist(b,t)<t.r+10*bs){
            applyDmg(t,c.dmg*player.dmgMult*bmult*dmgK,10*bs,Math.cos(a),Math.sin(a));
            fx.push({kind:'ring',x:b.x,y:b.y,t:0,dur:0.25,r0:4,r1:12+8*bs,col:'#ffd24a'});
            fx.push({kind:'spark',x:b.x,y:b.y,t:0,dur:0.15,col:'#fff6d0'});
            if(t.dead){b.kills++;b.t=0.25;}
            else b.t=c.cd*watchMult()*0.85;
            b.st='follow';b.tgt=null;
            SOUND.hit();
          }
        }
        for(const e of enemies){
          if(e.dead)continue;
          const rr=br+e.r;
          const dx=e.x-b.x,dy=e.y-b.y;
          if((dx<rr&&-dx<rr)&&(dy<rr&&-dy<rr)&&dx*dx+dy*dy<rr*rr&&!b.hit.has(e)){
            b.hit.add(e);
            applyDmg(e,c.dmg*player.dmgMult*bmult*0.5*dmgK,6,Math.cos(angTo(b,e)),Math.sin(angTo(b,e)));
            if(e.dead)b.kills++;
            fx.push({kind:'spark',x:e.x,y:e.y,t:0,dur:0.12,col:'#ffd2a0'});
          }
        }
      }
    }

    let b2=[];
    for(const b of bottles){
      b.t+=dt;
      const t=clamp(b.t/0.55,0,1);
      b.x=b.sx+Math.cos(b.ang)*b.spd*12*t;
      b.y=b.sy+Math.sin(b.ang)*b.spd*12*t+34*t*t;
      if(t>=1){
        zones.push({x:b.x,y:b.y,r:b.zoneR,dmg:b.dmg,t:b.zoneDur,tickT:0,col:b.col||'#6ad0ff',poisonDps:b.poisonDps||0,pct:b.pct||0,slow:!!b.slow});
        fx.push({kind:'ring',x:b.x,y:b.y,t:0,dur:0.4,r0:6,r1:b.zoneR,col:'#6ad0ff'});
        SOUND.hit();
      }else b2.push(b);
    }
    bottles=b2;
    let z2=[];
    for(const z of zones){
      z.t-=dt;
      z.tickT-=dt;
      if(z.tickT<=0){
        z.tickT=0.4;
        for(const e of enemies){
          const dx=e.x-z.x,dy=e.y-z.y,rr=z.r+e.r*0.5;
          if((dx<rr||-dx<rr)&&(dy<rr||-dy<rr)&&dx*dx+dy*dy<rr*rr){
            applyDmg(e,z.dmg,6,Math.cos(angTo(e,z)),Math.sin(angTo(e,z)));
            fx.push({kind:'spark',x:e.x,y:e.y+Math.sin(T*5)*6,t:0,dur:0.18,col:z.col||'#6ad0ff'});
            if(z.slow&&!e.elite)e.slow=Math.max(e.slow||0,0.6);
            if(z.poisonDps){e.poisonDps=z.poisonDps;e.poisonT=1.2;}
            if(z.pct){applyDmg(e,e.maxHp*z.pct,0,0,0);}
          }
        }
      }
      if(z.t>0)z2.push(z);
    }
    zones=z2;

    let bl=[];
    for(const b of bolts){
      b.life-=dt;
      let consume=false;
      if(b.life>0){
        b.x+=b.dx*(1+40*dt);b.y+=b.dy*(1+40*dt);
        b.x=clamp(b.x,10,WORLD-10);b.y=clamp(b.y,10,WORLD-10);
        const mb=mirrorBounce();
        if(mb>0&&(b.bn||0)<mb){
          let touched=false;
          if(b.x===10||b.x===WORLD-10){b.dx=-b.dx;touched=true;}
          if(b.y===10||b.y===WORLD-10){b.dy=-b.dy;touched=true;}
          if(touched){b.bn=(b.bn||0)+1;fx.push({kind:'spark',x:b.x,y:b.y,t:0,dur:0.15,col:'#fff'});}
        }
        for(const e of enemies){
          if(e.dead)continue;
          const dx=e.x-b.x,dy=e.y-b.y,rr=e.r+b.r;
          if((dx<rr||-dx<rr)&&(dy<rr||-dy<rr)&&dx*dx+dy*dy<rr*rr&&!b.hit.has(e)){
            b.hit.add(e);
            let dd=b.d;
            if(b.kind==='axe'&&e.hp>0&&e.hp<=e.maxHp*0.3)dd=e.hp;
            applyDmg(e,dd,10,b.dx/18,b.dy/18);
            fx.push({kind:'spark',x:b.x,y:b.y,t:0,dur:0.15,col:'#fff'});
            if(b.kind==='wine'){
              for(const o of enemies){
                if(o===e||o.dead)continue;
                const sr=38+o.r;
                if(dist(o,b)<sr)applyDmg(o,b.d*0.5,5,Math.cos(angTo(b,o)),Math.sin(angTo(b,o)));
              }
            }
            if(!b.pierce){
              const mb=mirrorBounce();
              if(mb>0&&(b.bn||0)<mb&&b.life>0.05){
                b.bn=(b.bn||0)+1;
                const dx=b.x-e.x,dy=b.y-e.y,dd=Math.sqrt(dx*dx+dy*dy)||1;
                const dot=b.dx*dx+b.dy*dy;
                b.dx-=2*(dot/(dd*dd))*dx;
                b.dy-=2*(dot/(dd*dd))*dy;
                fx.push({kind:'spark',x:b.x,y:b.y,t:0,dur:0.15,col:'#fff'});
              }else{consume=true;break;}
            }
          }
        }
        if(!consume&&b.kind==='knife'&&Math.random()<0.06)parts.push({x:b.x,y:b.y,vx:0,vy:0,life:0.12,r:2.5,col:'#cbbee6'});
      }else consume=true;
      if(consume){b.hit.clear();boltPool.push(b);}
      else bl.push(b);
    }
    bolts=bl;
    if(boltPool.length>150)boltPool.length=150;

    let eb2=[];
    for(const b of ebolts){
      b.life-=dt;
      if(b.life<=0)continue;
      // Tracking fireballs
      if(b.track){
        const ta=angTo(b,player);
        const spd=Math.hypot(b.dx,b.dy);
        b.dx=Math.cos(ta)*spd;b.dy=Math.sin(ta)*spd;
      }
      b.x+=b.dx*dt;b.y+=b.dy*dt;
      // Wall bounce for saw blades
      if(b.bounce&&(b.x<20||b.x>WORLD-20||b.y<20||b.y>WORLD-20)){
        if(b.x<20||b.x>WORLD-20)b.dx*=-1;
        if(b.y<20||b.y>WORLD-20)b.dy*=-1;
        b.x=clamp(b.x,20,WORLD-20);b.y=clamp(b.y,20,WORLD-20);
        b.bounce=false;
      }
      b.dx*=0.995;b.dy*=0.995;
      const dx=b.x-player.x,dy=b.y-player.y,rr=p.r+(b.r||6);
      if((dx<rr||-dx<rr)&&(dy<rr||-dy<rr)&&dx*dx+dy*dy<rr*rr){
        hurtPlayer(b.dmg,angTo(player,b));
        fx.push({kind:'spark',x:b.x,y:b.y,t:0,dur:0.15,col:'#fff'});
        continue;
      }
      eb2.push(b);
    }
    ebolts=eb2;

    if(Math.random()<dt*1.5&&ownedLv('spark')>0){
      const sa=Math.random()*6.283;
      fx.push({kind:'bolt',x:player.x+Math.cos(sa)*46,y:player.y+Math.sin(sa)*46,t:0,dur:0.22});
    }

    for(const s of fx){
      s.t+=dt;
    }
    fx=fx.filter(s=>s.t<=(s.dur||1));
    if(fx.length>300)fx.splice(0,fx.length-300);
    for(const pt of parts){pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;}
    parts=parts.filter(pt=>pt.life>0);
    for(const tx of texts){tx.t+=dt;tx.y+=tx.vy*dt;tx.vy*=0.9;}
    texts=texts.filter(tx=>tx.t<tx.dur);

    const mag=p.magnetMult*95;
    let g2=[];
    for(const g of gems){
      if(state!=='play'){g2.push(g);continue;}
      const d=dist(player,g);
      if(d<mag){
        g.x+=((player.x-g.x)/d)*260*dt;g.y+=((player.y-g.y)/d)*260*dt;
        if(d<16){
          player.xp+=g.val;
          xpGot+=g.val;
          texts.push({x:player.x,y:player.y-30,txt:'+'+g.val,col:'#bfe5ff',t:0,dur:0.5,vy:-40});
          SOUND.gem();
          if(player.xp>=player.xpNeed){xpOverflow();continue;}
          continue;
        }
      }
      g2.push(g);
    }
    gems=g2;

    if(chest&&state==='play'){
      chest.t+=dt;
      const d=dist(player,chest);
      if(d<150){
        chest.x+=((player.x-chest.x)/d)*220*dt;chest.y+=((player.y-chest.y)/d)*220*dt;
        if(d<20){offerCards();chest=null;SOUND.lvl();}
      }
    }

    // Ghost wolves
    let gw2=[];
    for(const gw of ghostWolves){
      gw.t-=dt;
      if(gw.t<=0)continue;
      gw.hitT-=dt;
      if(gw.hitT<=0){gw.hit.clear();gw.hitT=0.8;}
      const nt=nearestEnemy(gw.x,gw.y,300);
      if(nt){
        const nga=Math.atan2(nt.y-gw.y,nt.x-gw.x);
        gw.x+=Math.cos(nga)*220*dt;gw.y+=Math.sin(nga)*220*dt;
        if(dist(gw,nt)<nt.r+14&&!gw.hit.has(nt)){
          gw.hit.add(nt);
          applyDmg(nt,gw.dmg*player.dmgMult,5,nga,nga);
          fx.push({kind:'spark',x:nt.x,y:nt.y,t:0,dur:0.12,col:'#c0c0f0'});
        }
      }else{
        gw.x+=gw.vx*dt;gw.y+=gw.vy*dt;
      }
      gw.x=clamp(gw.x,20,WORLD-20);gw.y=clamp(gw.y,20,WORLD-20);
      gw2.push(gw);
    }
    ghostWolves=gw2;

    // Furnace core timer
    if(hasFurnaceCore()){
      furnaceCoreTimer+=dt;
      if(furnaceCoreTimer>=5)furnaceCoreTimer=5;
    }

    if(p.hp>0&&state==='play')for(const w of player.weapons){
      if(w.id==='whip'){
        const s=fx.find(f=>f.kind==='slash');
        if(s&&!s.applied&&s.t>=s.dur*0.35){
          s.applied=true;
          for(const e of enemies){
            const dx=e.x-s.x,dy=e.y-s.y,rr=s.rad+e.r;
            if((dx<rr||-dx<rr)&&(dy<rr||-dy<rr)&&dx*dx+dy*dy<rr*rr){
              let da=angTo({x:s.x,y:s.y},e)-s.ang;
              while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;
              if(Math.abs(da)<(s.cone/2)*D2R){applyDmg(e,s.d,14,Math.cos(s.ang),Math.sin(s.ang));player.hp=Math.min(player.maxHp,player.hp+s.d*(s.leech||0));}
            }
          }
          SOUND.hit();
        }
      }
    }
    if(Math.random()<0.08*dt)parts.push({x:player.x,y:player.y+14,vx:rnd(-4,4),vy:rnd(-30,6),life:0.4,r:2,col:'#6a5a8a'});
  }
  shake*=Math.pow(0.001,dt);red=Math.max(0,red-dt*0.7);flash=Math.max(0,flash-dt);
}

function gameOver(){
  state='gameover';
  try{gameOverSaveScore();}catch(_){}
  SOUND.die();
}

function xpOverflow(){
  let count=0;
  while(player.xp>=player.xpNeed&&count<20){
    player.xp-=player.xpNeed;
    levelUpInstant();
    count++;
  }
  offerCards();
  SOUND.lvl();
}

function levelUpInstant(){
  player.level++;
  player.maxHp+=10;
  player.hp=player.maxHp;
  player.xpNeed=Math.round(28+player.level*8+player.level*player.level*1.6);
}

function camUpdate(dt){
  const vw=W/ZOOM,vh=H/ZOOM;
  camx+= (player.x-vw/2-camx)*Math.min(1,dt*8);
  camy+= (player.y-vh/2-camy)*Math.min(1,dt*8);
  camx=clamp(camx,0,WORLD-vw);
  camy=clamp(camy,0,WORLD-vh);
}

function drawWorld(){
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,0,0);
  const shx=(Math.random()*2-1)*shake,shy=(Math.random()*2-1)*shake;
  ctx.translate(-Math.round(camx+shx),-Math.round(camy+shy));
  ctx.fillStyle=PATT;
  ctx.fillRect(Math.floor(camx/1),Math.floor(camy/1)-40,W+40,H+40);
  ctx.strokeStyle='#3a2452';ctx.lineWidth=18;
  ctx.strokeRect(-9,-9,WORLD+18,WORLD+18);
  ctx.strokeStyle='#4d2f6d';ctx.lineWidth=6;
  ctx.strokeRect(-4,-4,WORLD+8,WORLD+8);
}

function drawFg(){
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,0,0);
  ctx.translate(-Math.round(camx),-Math.round(camy));
  for(const e of enemies)drawEnemy(e);
  for(const b of bolts)drawBolt(b);
  for(const b of ebolts)drawBone(b);
  for(const to of tomes){
    ctx.save();
    ctx.translate(to.x,to.y);
    ctx.rotate(Math.sin(to.t*18)*0.45);
    ctx.shadowColor='#ffb43a';
    ctx.shadowBlur=12;
    ctx.fillStyle='#ffe9b0';
    ctx.fillRect(-7,-5,14,10);
    ctx.shadowBlur=0;
    ctx.fillStyle='#8a5a1a';
    ctx.fillRect(-7,-5,14,3);
    ctx.strokeStyle='#b8860b';
    ctx.lineWidth=1;
    ctx.strokeRect(-7,-5,14,10);
    ctx.fillStyle='#f5e6c0';
    ctx.fillRect(-4,-5,2,10);
    ctx.fillRect(2,-5,2,10);
    ctx.restore();
  }
  for(const b of birds)drawBird(b);
  if(chest){
    const yy=chest.y+Math.sin(chest.t*6)*3;
    ctx.fillStyle='#8a5a2b';ctx.fillRect(chest.x-12,yy-10,24,18);
    ctx.fillStyle='#ffd24a';ctx.fillRect(chest.x-12,yy-10,24,5);
    ctx.strokeStyle='#5a3a18';ctx.strokeRect(chest.x-12,yy-10,24,18);
  }
  if(eliteWarn){
    const k=1-(eliteWarn.t/1.0);
    ctx.strokeStyle='rgba(255,80,96,'+(0.5+0.5*Math.sin(eliteWarn.t*20))+')';
    ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(eliteWarn.x,eliteWarn.y,40+20*k,0,6.283);ctx.stroke();
  }
  if(bossWarn){
    const k=1-(bossWarn.t/1.5);
    ctx.strokeStyle='rgba(255,20,40,'+(0.6+0.4*Math.sin(bossWarn.t*16))+')';
    ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(bossWarn.x,bossWarn.y,60+30*k,0,6.283);ctx.stroke();
    ctx.fillStyle='rgba(255,20,40,0.15)';
    ctx.beginPath();ctx.arc(bossWarn.x,bossWarn.y,56+28*k,0,6.283);ctx.fill();
    ctx.font='bold 16px Consolas,monospace';ctx.textAlign='center';
    ctx.fillStyle='rgba(255,80,60,'+(0.7+0.3*Math.sin(bossWarn.t*12))+')';
    ctx.fillText('⚠ Lv.'+player.level+' BOSS '+BOSS_NAMES[currentBossType]+' 来袭 ⚠',bossWarn.x,bossWarn.y-80);
  }
  // Dragon final breath safe zones
  const dragonBoss=enemies.find(e=>e.boss&&!e.dead&&e.bossType==='dragon_ignix'&&e.pattern==='final_breath'&&e.st===2);
  if(dragonBoss){
    ctx.fillStyle='rgba(100,200,255,0.25)';
    ctx.fillRect(0,0,100,WORLD);
    ctx.fillRect(WORLD-100,0,100,WORLD);
    ctx.strokeStyle='rgba(100,200,255,0.6)';
    ctx.lineWidth=4;
    ctx.setLineDash([12,8]);
    ctx.strokeRect(0,0,100,WORLD);
    ctx.strokeRect(WORLD-100,0,100,WORLD);
    ctx.setLineDash([]);
    ctx.fillStyle='#bfe8ff';
    ctx.font='bold 14px Consolas,monospace';
    ctx.textAlign='center';
    ctx.fillText('安全区',50,WORLD/2);
    ctx.fillText('安全区',WORLD-50,WORLD/2);
  }
  for(const g of gems){
    ctx.fillStyle= g.val>=15?'#ffb84d':'#7be0ff';
    ctx.beginPath();ctx.moveTo(g.x,g.y-6);ctx.lineTo(g.x+5,g.y);ctx.lineTo(g.x,g.y+6);ctx.lineTo(g.x-5,g.y);ctx.fill();
  }
  for(const z of zones){
    const zc=z.col||'#6ad0ff';
    drawGlow(z.x,z.y,z.r,'rgba('+hexR(zc)+','+(0.1+0.05*Math.sin(T*4))+')');
    ctx.strokeStyle='rgba('+hexR(zc)+','+(0.55+0.2*Math.sin(T*6))+')';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,6.283);ctx.stroke();
    for(let i=0;i<3;i++){
      const fl=T*3+i*2.1;
      ctx.globalAlpha=0.45;
      ctx.fillStyle='#'+zc.slice(1);
      ctx.beginPath();ctx.arc(z.x+Math.sin(fl)*z.r*0.5,z.y+Math.cos(fl*0.7)*z.r*0.5,4+Math.sin(T*7+i)*2,0,6.283);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  for(const b of bottles){
    const t=clamp(b.t/0.55,0,1);
    const bc=b.col||'#3a9acf';
    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.rotate(t*6);
    ctx.fillStyle=bc;
    ctx.fillRect(-3,-6,6,8);
    ctx.fillStyle='#f0e0c8';
    ctx.fillRect(-2,-7,4,2);
    ctx.restore();
  }
  for(const f of fx){
    if(f.kind==='ring'){
      const k=f.t/f.dur;
      ctx.strokeStyle=f.col||'#fff';
      ctx.globalAlpha=1-k;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r0+(f.r1-f.r0)*k,0,6.283);ctx.stroke();
      ctx.globalAlpha=1;
    }else if(f.kind==='slash'){
      const k=f.t/f.dur;
      ctx.globalAlpha=1-k;
      ctx.fillStyle='#f5e6ff';
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.rad*0.92,f.ang-f.cone/2*D2R,f.ang+f.cone/2*D2R);
      ctx.arc(f.x,f.y,f.rad*(0.2+0.5*k),f.ang+f.cone/2*D2R,f.ang-f.cone/2*D2R,true);
      ctx.fill();
      ctx.globalAlpha=1;
    }else if(f.kind==='bolt'){
      const k=f.t/f.dur;
      ctx.strokeStyle= k<0.3?'#fff56a':'#ffffff';
      ctx.lineWidth=3;
      ctx.globalAlpha=1-k;
      for(let i=0;i<5;i++){
        const x1=f.x+rnd(-20,20),y1=f.y+rnd(-20,20),x2=f.x+Math.cos(i*2.5)*34,y2=f.y+Math.sin(i*2.5)*34;
        ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo((x1+x2)/2,(y1+y2)/2);ctx.lineTo(f.x,f.y-2);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }else if(f.kind==='spark'){
      const k=f.t/f.dur;
      ctx.globalAlpha=1-k;
      ctx.fillStyle=f.col||'#fff';
      ctx.fillRect(f.x-3,f.y-3,6,6);
      ctx.globalAlpha=1;
    }
  }
  for(const pt of parts){
    ctx.globalAlpha=Math.max(0,pt.life/0.6);
    ctx.fillStyle=pt.col;
    ctx.fillRect(pt.x-pt.r,pt.y-pt.r,pt.r*2,pt.r*2);
    ctx.globalAlpha=1;
  }
  ctx.font='bold 13px Consolas,monospace';
  ctx.textAlign='center';
  for(const tx of texts){
    ctx.globalAlpha=Math.max(0,1-tx.t/tx.dur);
    ctx.fillStyle=tx.col;
    ctx.fillText(tx.txt,tx.x,tx.y);
  }
  ctx.globalAlpha=1;
  drawPlayer();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  shake*=0.7;
}

function drawBone(b){
  if(b.kind==='witchBolt'){
    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.rotate(Math.atan2(b.dy,b.dx));
    ctx.shadowColor='#8a5ad8';
    ctx.shadowBlur=10;
    ctx.fillStyle='#a87ae8';
    ctx.beginPath();
    ctx.moveTo(-8,0);
    ctx.lineTo(6,-3);
    ctx.lineTo(6,3);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#e8dcf7';
    ctx.beginPath();
    ctx.arc(4,0,2.2,0,6.283);
    ctx.fill();
    ctx.restore();
    return;
  }
  if(b.kind==='eliteShot'){
    const pulse=1+Math.sin(T*12)*0.15;
    const er=(b.r||11);
    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.shadowColor='#ff5060';
    ctx.shadowBlur=18;
    ctx.fillStyle='#ff8a9a';
    ctx.beginPath();ctx.arc(0,0,er*0.85*pulse,0,6.283);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(0,0,er*0.38*pulse,0,6.283);ctx.fill();
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(Math.atan2(b.dy,b.dx));
  ctx.fillStyle='#e8e0ce';
  ctx.fillRect(-9,-2,14,4);
  ctx.fillRect(-3,-5,4,4);
  ctx.fillRect(-3,1,4,4);
  ctx.fillRect(3,-5,4,4);
  ctx.fillRect(3,1,4,4);
  ctx.restore();
}

function drawGlow(x,y,r,col){
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
}

function drawBird(b){
  const flap=Math.sin(b.wing)*4;
  const stk=b.st==='strike';
  const s=(b.size||1);
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(stk?Math.sin(b.wing)*0.3:0);
  ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();ctx.ellipse(0,4,6,2.5,0,0,6.283);ctx.fill();
  ctx.fillStyle='#f6f6f4';
  ctx.beginPath();
  ctx.moveTo(-2.5,-1.5);ctx.lineTo(-9,-2-flap);ctx.lineTo(-2.5,1.5);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(2.5,-1.5);ctx.lineTo(9,-2+flap);ctx.lineTo(2.5,1.5);
  ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,7,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e8e8f0';
  ctx.beginPath();ctx.arc(0,2.5,3.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2a2a3a';

  ctx.beginPath();ctx.arc(2.5,-1.2,1.2,0,6.283);ctx.fill();
  ctx.fillStyle='#ffb43a';
  ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(9.5,1.5);ctx.lineTo(5,2.5);ctx.fill();

  ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,3.8);ctx.lineTo(0,6.8);ctx.stroke();

}

function primaryWeapon(){
  let best=null;
  for(const w of player.weapons){
    if(w.id==='bird')continue;
    if(!best||w.lv>best.lv)best=w;
  }
  return best?best.id:null;
}

function wepRarity(w){return w&&w.id==='bird'?4:rarityOf(w?w.lv:0);}

  ctx.fill();
  ctx.fillStyle='#181020';
  ctx.beginPath();
  ctx.moveTo(-13,-14);
  ctx.quadraticCurveTo(-16,2,-12,16);

  ctx.quadraticCurveTo(16,2,13,-14);
  ctx.fill();

function drawHeldWeapon(id,sx){
  ctx.save();
  ctx.translate(6*sx,-2);
  ctx.rotate(Math.sin(T*10)*0.05);
  switch(id){
    case 'bolt':
      ctx.save();
      ctx.rotate(-0.25+Math.sin(T*3)*0.04);
      ctx.shadowColor='#ff4a6a';
      ctx.shadowBlur=8;
      ctx.fillStyle='#b3243e';
      ctx.beginPath();
      ctx.moveTo(-7,-34);
      ctx.quadraticCurveTo(-6,-22,0,-20);
      ctx.quadraticCurveTo(6,-22,7,-34);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='#eaf6fb';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(-7,-34);
      ctx.quadraticCurveTo(-6,-22,0,-20);
      ctx.quadraticCurveTo(6,-22,7,-34);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle='#ff5060';
      ctx.beginPath();
      ctx.ellipse(0,-33,6.2,1.8,0,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.ellipse(-2,-26,1.1,2.6,0.25,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#d8ecf4';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(0,-20);
      ctx.lineTo(0,-4);
      ctx.stroke();
      ctx.fillStyle='#d8ecf4';
      ctx.beginPath();
      ctx.ellipse(0,-2,4,1.3,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
      break;
    case 'knife':
      ctx.fillStyle='#d8d8f0';
      ctx.shadowColor='#a0a0c0';
      ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.moveTo(0,8);
      ctx.lineTo(4,0);
      ctx.lineTo(0,-16);
      ctx.lineTo(-4,0);
      ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='#8a6a3a';
      ctx.fillRect(-1.5,-4,3,5);
      ctx.fillStyle='#c0a060';
      ctx.fillRect(-2,-2,4,2);
      break;
    case 'whip':
      ctx.shadowColor='#ffd700';
      ctx.shadowBlur=15;
      ctx.strokeStyle='#d4a84a';
      ctx.lineWidth=3;
      ctx.beginPath();
      for(let i=0;i<=8;i++){
        const t=i/8;
        const wx=-2+t*18;
        const wy=6-Math.sin(t*Math.PI*4+T*18)*6+t*2;
        if(i===0)ctx.moveTo(wx,wy);
        else ctx.lineTo(wx,wy);
      }
      ctx.stroke();
      ctx.shadowBlur=20;
      ctx.fillStyle='#ffd700';
      ctx.beginPath();
      ctx.arc(16,0,3,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
      break;
    case 'tome':
      ctx.shadowColor='#ffe9b0';
      ctx.shadowBlur=12;
      ctx.fillStyle='#8a6a3a';
      ctx.fillRect(-5,-6,10,14);
      ctx.fillStyle='#ffe9b0';
      ctx.fillRect(-4,-5,8,12);
      ctx.strokeStyle='#b8860b';
      ctx.lineWidth=1.5;
      ctx.strokeRect(-4,-5,8,12);
      ctx.fillStyle='#f5e6c0';

      ctx.arc(0,-4,auraSize,0,Math.PI*2);

      ctx.quadraticCurveTo(-6,2,-4,-2);

      ctx.quadraticCurveTo(6,2,4,8);

      for(let i=0;i<3;i++){
        ctx.fillStyle='rgba(255,244,200,'+(0.5+0.4*Math.sin(T*5+i*2))+')';
        ctx.beginPath();
        ctx.arc(-3+i*3,-1,1.2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.shadowBlur=0;
      break;
    case 'holy':

      ctx.shadowBlur=12;

      ctx.quadraticCurveTo(6,2,4,8);

      ctx.fillRect(-3,-2,6,5);
      ctx.fillStyle='#2a6a8a';
      ctx.fillRect(-2,-5,4,3);
      ctx.fillStyle='#ffe9b0';
      ctx.fillRect(-0.5,-8,1,6);

    case 'axe':
      ctx.shadowColor='#d8c9a8';
      ctx.shadowBlur=8;
      ctx.fillStyle='#d8c9a8';
      ctx.beginPath();
      ctx.moveTo(-2,-14);
      ctx.lineTo(5,-8);
      ctx.lineTo(0,-4);

      ctx.lineTo(0,10);

      ctx.lineWidth=2;
      ctx.beginPath();

function drawEnemy(e){
  const windup=e.st===1;
  const attacking=e.st===2;
  const hitShake=(e.hitFlash>0)?(Math.random()*5-2.5):0;
  const ex=e.x+hitShake,ey=e.y+Math.sin(T*8+e.r*3)*2;
  const sx=player.x>=e.x?1:-1;
  const scl=e.scl||1;
  const sc=(windup?1.14:1)*(attacking?1.12:1)*scl;
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*0.95,e.r*1.1*Math.sqrt(scl),e.r*0.45*Math.sqrt(scl),0,0,6.283);ctx.fill();
  ctx.save();
  ctx.translate(ex,ey);
  ctx.scale(sx*sc,sc);
  if(e.elite)drawElite(e,windup,attacking);
  else if(e.boss)drawBoss(e,windup,attacking);
  else if(e.clone)drawClone(e);
  else if(e.kind==='bat')drawBat(e,windup,attacking);
  else if(e.kind==='wolf')drawWolf(e,windup,attacking);
  else if(e.kind==='ghost')drawGhost(e,windup,attacking);
  else if(e.kind==='zombie')drawZombie(e,windup,attacking);
  else if(e.kind==='skeleton')drawSkeleton(e,windup,attacking);
  else if(e.kind==='witch')drawWitch(e,windup,attacking);
  else if(e.kind==='golem')drawGolem(e,windup,attacking);
  ctx.restore();
  if(e.hitFlash>0){
    const hitK=(e.hitFlash||0)/0.14;
    ctx.globalAlpha=Math.min(1,hitK*0.85);
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*1.1,0,6.283);ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,0.9)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*1.2,0,6.283);ctx.stroke();
  }
  if(windup){
    ctx.strokeStyle='rgba(255,255,255,'+(0.35+0.35*Math.sin(T*20))+')';
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r+6,0,6.283);ctx.stroke();
    ctx.fillStyle='#ff5060';
    ctx.font='bold 12px Consolas,monospace';
    ctx.textAlign='center';
    ctx.fillText('!',e.x,e.y-e.r-8);
  }
}

    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.rotate(Math.atan2(b.dy,b.dx)+Math.sin(b.spin+T*18)*0.7);
    ctx.shadowColor='#d8c9a8';
    ctx.shadowBlur=8;
    ctx.fillStyle='#e8dcc0';
    ctx.fillRect(2,-3,8,6);
    ctx.beginPath();ctx.moveTo(8,-12);ctx.lineTo(13,0);ctx.lineTo(4,-3);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#6a4a2a';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(-9,0);ctx.stroke();
    ctx.restore();
  }else if(b.kind==='wine'){
    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.rotate(Math.atan2(b.dy,b.dx));
    ctx.shadowColor='#ff4a6a';
    ctx.shadowBlur=14;
    ctx.fillStyle='#ff4a6a';
    ctx.beginPath();
    ctx.ellipse(0,0,3.4,5,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-1,-1.5,1,1.7,0,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }else{
    ctx.save();
    ctx.globalAlpha=0.3;
    ctx.fillStyle=b.col;
    ctx.beginPath();ctx.arc(b.x-b.dx*1.5,b.y-b.dy*1.5,b.r*0.85,0,6.283);ctx.fill();
    ctx.globalAlpha=1;
    ctx.shadowColor=b.col;
    ctx.shadowBlur=16;
    ctx.fillStyle=b.col;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.45,0,6.283);ctx.fill();
    ctx.restore();
  }
}

function drawWepIcon(id,x,y,rarity){
  ctx.save();
  ctx.translate(x,y);
  if(rarity){
    ctx.fillStyle=RARITY_COL[rarity];
    ctx.beginPath();ctx.arc(9,-9,3.5,0,6.283);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath();ctx.arc(9,-9,1.2,0,6.283);ctx.fill();
  }
  if(id==='bolt'){
    ctx.strokeStyle='#6a4a2a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(0,-2);ctx.stroke();
    ctx.fillStyle='#6fd8ff';
    ctx.beginPath();ctx.arc(0,-5,4.5,0,6.283);ctx.fill();
  }else if(id==='knife'){
    ctx.fillStyle='#e8e2f5';
    ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(3,4);ctx.lineTo(0,-7);ctx.lineTo(-3,4);ctx.fill();
  }else if(id==='whip'){
    ctx.strokeStyle='#c9a86a';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,10);ctx.quadraticCurveTo(9,4,2,-2);ctx.quadraticCurveTo(-2,-6,0,-10);ctx.stroke();
  }else if(id==='tome'){
    ctx.fillStyle='#ffe9b0';ctx.fillRect(-5,-7,10,15);
    ctx.strokeStyle='#b8860b';ctx.lineWidth=1.5;ctx.strokeRect(-5,-7,10,15);
    ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,8);ctx.stroke();
  }else if(id==='aura'){
    ctx.fillStyle='#8adea0';
    ctx.beginPath();ctx.arc(0,0,6.5,0,6.283);ctx.fill();
    ctx.fillStyle='#2a5a3a';
    ctx.beginPath();ctx.arc(0,0,2.8,0,6.283);ctx.fill();
  }else if(id==='spark'){
    ctx.strokeStyle='#ffd24a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(2,2);ctx.lineTo(-2,-2);ctx.lineTo(1,-10);ctx.stroke();
  }else if(id==='bottle'){
    ctx.fillStyle='#3a9acf';
    ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(3,2);ctx.lineTo(-3,2);ctx.fill();
    ctx.fillStyle='#9fe4ff';
    ctx.fillRect(-3,2,6,4);
    ctx.fillStyle='#d8c9a8';
    ctx.fillRect(-2,-2,4,4);
  }else if(id==='axe'){
    ctx.fillStyle='#d8c9a8';
    ctx.beginPath();ctx.moveTo(-2,-10);ctx.lineTo(4,-7);ctx.lineTo(0,-1);ctx.fill();
    ctx.strokeStyle='#6a4a2a';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,-1);ctx.lineTo(0,10);ctx.stroke();
  }else if(id==='frost'){
    ctx.strokeStyle='#9fe0ff';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(0,-6);ctx.moveTo(-5,4);ctx.lineTo(0,-2);ctx.lineTo(5,4);ctx.stroke();
    ctx.fillStyle='#bfe8ff';
    ctx.beginPath();ctx.arc(0,-8,3.5,0,6.283);ctx.fill();
  }else if(id==='bird'){
    ctx.fillStyle='#f6f6f4';
    ctx.beginPath();ctx.ellipse(0,0,5.5,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2a2a3a';
    ctx.beginPath();ctx.arc(-1.8,-0.8,1,0,6.283);ctx.fill();
    ctx.beginPath();ctx.arc(1.8,-0.8,1,0,6.283);ctx.fill();
    ctx.fillStyle='#ffb43a';
    ctx.beginPath();ctx.moveTo(3,0);ctx.lineTo(6.5,1);ctx.lineTo(3,2);ctx.fill();
  }
  ctx.restore();
}

function drawWeaponDetails(){

function getWeaponDesc(id,cfg){
  const r=(v)=>Math.round(v*10)/10;
  switch(id){
    case 'bolt':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 射程'+cfg.rng+' 弹道'+cfg.n+' ·命中溅射';
    case 'knife':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 弹道'+cfg.n+' ·30%暴击';
    case 'whip':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 范围'+cfg.rad+' ·吸血'+Math.round(cfg.leech*100)+'%';
    case 'tome':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 范围'+cfg.rad+' 书'+cfg.n+' ·灼烧地面';
    case 'aura':return '伤害'+r(cfg.dmg)+' 范围'+cfg.rad+' ·削弱敌方攻击';
    case 'spark':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 射程'+cfg.rng+' 落雷'+cfg.n+' ·麻痹';
    case 'bottle':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 范围'+cfg.zoneR+' ·粘稠减速';
    case 'beer':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 范围'+cfg.zoneR+' ·中每秒毒伤'+r(cfg.poisonDps);
    case 'holy':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 范围'+cfg.zoneR+' ·附加'+Math.round(cfg.pct*100)+'%生命伤害';
    case 'axe':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 弹道'+cfg.n+' ·斩杀残血';
    case 'frost':return '伤害'+r(cfg.dmg)+' 冷却'+cfg.cd.toFixed(2)+'s 范围'+cfg.rng+' ·冻结';
    case 'bird':return '伤害'+r(cfg.dmg)+' 攻击'+cfg.cd.toFixed(2)+'s 数量'+cfg.n+' ·击杀成长';
  }
  return '';
}

  rows.sort((a,b)=>b.s-a.s);
  const top=rows.slice(0,10);
  const myS=Math.floor(T);
  const myRank=rows.findIndex(r=>r.uid===playerUID&&r.s===myS);
  const myRankDisplay=myRank>=0?myRank+1:0;
  const me={n:getPlayerName(),s:myS,uid:playerUID};
  ctx.font='13px Consolas,monospace';
  ctx.fillStyle='#8f7cc0';
  ctx.fillText(top.length?'全服共享排行榜 · 前十名':'还没有成绩,先来一局吧',W/2,108);
  const boxX=W/2-220,boxW=440;
  for(let i=0;i<top.length;i++){
    const r=top[i];
    const ry=132+i*46;
    const isMe=r.uid===playerUID;
    ctx.fillStyle=isMe?'#2a1030':'#161026';
    ctx.beginPath();ctx.roundRect(boxX,ry-6,boxW,40,8);ctx.fill();
    if(isMe){ctx.strokeStyle='#ff9ad4';ctx.lineWidth=2;ctx.strokeRect(boxX+1,ry-5,boxW-2,38);}
    const mm=Math.floor(r.s/60),ss=Math.floor(r.s%60);
    const time=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    ctx.font='bold 16px Consolas,monospace';
    ctx.textAlign='left';
    ctx.fillStyle=i===0?'#ffd24a':(i===1?'#cfd8e8':(i===2?'#e8a56a':'#8f7cc0'));
    ctx.fillText((i+1)+'.',boxX+18,ry+22);
    ctx.fillStyle='#e8dcf7';
    ctx.fillText((r.n||'玩家')+(isMe?' (你)':''),boxX+66,ry+22);
    ctx.textAlign='right';
    ctx.fillStyle='#9fbfff';
    ctx.fillText(time,boxX+boxW-16,ry+22);
  }
  const my={x:boxX,y:132+10*46};
  ctx.fillStyle='#3a1020';
  ctx.beginPath();ctx.roundRect(boxX,my.y-6,boxW,40,8);ctx.fill();
  ctx.strokeStyle='#ff5060';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(boxX,my.y-6,boxW,40,8);ctx.stroke();
  const mm=Math.floor(me.s/60),ss=Math.floor(me.s%60);
  const time=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
  ctx.font='bold 16px Consolas,monospace';
  ctx.textAlign='left';
  ctx.fillStyle='#ff6e8a';
  ctx.fillText(myRankDisplay>0?('第'+myRankDisplay+'名'):'未上榜',boxX+18,my.y+22);
  ctx.fillText(me.n+' (本局)',boxX+150,my.y+22);
  ctx.textAlign='right';
  ctx.fillStyle='#ffd24a';
  ctx.fillText(time,boxX+boxW-16,my.y+22);
  ctx.textAlign='center';
  ctx.font='14px Consolas,monospace';
  ctx.fillStyle='#7a6a98';
  ctx.fillText('点击任意处返回',W/2,H-40);
}

function drawJoy(){
  const j=joyFromPts();
  if(!j.active)return;
  ctx.globalAlpha=0.35;
  ctx.fillStyle='#2a1a44';
  ctx.beginPath();ctx.arc(j.x,j.y,95,0,6.283);ctx.fill();
  ctx.strokeStyle='#6a5a98';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(j.x,j.y,95,0,6.283);ctx.stroke();
  ctx.globalAlpha=0.7;
  ctx.fillStyle='#4a3a6a';
  ctx.beginPath();ctx.arc(j.x+j.dx,j.y+j.dy,38,0,6.283);ctx.fill();
  ctx.globalAlpha=1;
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05);
  last=now;
  if(state==='title'){titleT+=dt;if(shareToast>0)shareToast-=dt;}
  update(dt);
  if(state==='play'&&player)camUpdate(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if(state==='play'||state==='card'||state==='pause'||state==='gameover'){
    drawWorld();
    drawFg();
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(red>0){
    ctx.fillStyle='rgba(255,40,40,'+(red*0.3)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(state==='play'||state==='pause'){
    drawHUD();
    if(state==='play'){drawJoy();drawDashHint();}
  }
  if(state==='card')drawCard();
  if(state==='title')drawTitle();
  if(state==='gameover')drawGameOver();
  if(state==='board')drawBoard();
}

function drawDashHint(){
  const cx2=W*0.74,cy2=H*0.8,r=34;
  ctx.globalAlpha=0.35;
  ctx.strokeStyle='#6a5a98';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx2,cy2,r,0,6.283);ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle='#bfe8ff';
  ctx.font='bold 13px Consolas,monospace';
  ctx.textAlign='center';
  ctx.fillText('冲刺',cx2,cy2+4);
  if(player&&player.dashCd>0){
    const k=clamp(1-player.dashCd/DASH_CD,0,1);
    ctx.globalAlpha=0.6;ctx.strokeStyle='#4ea0ff';ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(cx2,cy2,r-4,-Math.PI/2,-Math.PI/2+6.283*k);ctx.stroke();
    ctx.globalAlpha=1;
  }
  ctx.globalAlpha=1;
}

requestAnimationFrame(frame);
</script>
